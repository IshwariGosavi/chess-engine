<!DOCTYPE html>
<html>
<head>
    <title>Chess Engine</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            margin-top: 40px;
        }

        #board {
            width: 400px;
        }
    </style>
</head>
<body>

    <h1>Chess Engine</h1>

    <div id="modeSelect">
        <button id="modeBotBtn" style="padding: 12px 24px; font-size: 16px; margin-right: 10px;">Play a Bot</button>
        <button id="modeFriendBtn" style="padding: 12px 24px; font-size: 16px;">Play a Friend</button>
    </div>

    <div id="gameArea" style="display: none; gap: 40px; align-items: flex-start;">
        <div>
            <div id="board"></div>
            <button id="newGameBtn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px;">New Game</button>
            <button id="undoBtn" style="margin-top: 20px; margin-left: 10px; padding: 10px 20px; font-size: 16px;">Undo</button>
            <button id="resignBtn" style="margin-top: 20px; margin-left: 10px; padding: 10px 20px; font-size: 16px; background-color: #d9534f; color: white;">Resign</button>
        </div>
        <div>
            <h3>Moves</h3>
            <table id="moveList" style="border-collapse: collapse; min-width: 150px;"></table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var gameLocked = false;  // true once the game has ended (checkmate/resign)

        function onDragStart(source, piece, position, orientation) {
            if (gameLocked) {
                return false;  // block dragging entirely once game is over
            }
            return true;
        }

        function renderMoveList(moves) {
            var table = document.getElementById('moveList');
            table.innerHTML = '';

            for (var i = 0; i < moves.length; i += 2) {
                var moveNumber = (i / 2) + 1;
                var whiteMove = moves[i] || '';
                var blackMove = moves[i + 1] || '';

                var row = document.createElement('tr');
                row.innerHTML =
                    '<td style="padding: 4px 8px; color: #888;">' + moveNumber + '.</td>' +
                    '<td style="padding: 4px 8px; font-weight: bold;">' + whiteMove + '</td>' +
                    '<td style="padding: 4px 8px;">' + blackMove + '</td>';
                table.appendChild(row);
            }
        }

        function updateMoveList() {
            fetch('/api/moves')
                .then(response => response.json())
                .then(data => {
                    renderMoveList(data.moves);
                });
        }

        function onDrop(source, target, piece) {
            var moveUci = source + target;

            var isPawn = piece === 'wP' || piece === 'bP';
            var reachedLastRank = target[1] === '8' || target[1] === '1';

            if (isPawn && reachedLastRank) {
                moveUci += 'q';
            }

            fetch('/api/human-move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ move: moveUci })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    fetch('/api/board')
                        .then(response => response.json())
                        .then(boardData => {
                            board.position(boardData.fen, false);
                        });
                    return;
                }

                board.position(data.fen, false);
                updateMoveList();

                if (data.is_game_over) {
                    gameLocked = true;
                    alert("Game over!");
                    return;
                }

                if (data.mode === "bot") {
                    fetch('/api/engine-move')
                        .then(response => response.json())
                        .then(engineData => {
                            board.position(engineData.fen, false);
                            updateMoveList();
                            if (engineData.is_game_over) {
                                gameLocked = true;
                                alert("Game over!");
                            }
                        });
                }
            });
        }

        var config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop
        };

        board = Chessboard('board', config);

        function startGame(mode) {
            fetch('/api/set-mode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: mode })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('modeSelect').style.display = 'none';
                document.getElementById('gameArea').style.display = 'flex';
                gameLocked = false;
                board.position(data.fen, false);
                updateMoveList();
            });
        }

        document.getElementById('modeBotBtn').addEventListener('click', function() {
            startGame('bot');
        });

        document.getElementById('modeFriendBtn').addEventListener('click', function() {
            startGame('friend');
        });

        document.getElementById('newGameBtn').addEventListener('click', function() {
            fetch('/api/reset', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    gameLocked = false;
                    board.position(data.fen, false);
                    updateMoveList();
                });
        });

        document.getElementById('undoBtn').addEventListener('click', function() {
            fetch('/api/undo', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    gameLocked = false;
                    board.position(data.fen, false);
                    updateMoveList();
                });
        });

        document.getElementById('resignBtn').addEventListener('click', function() {
            fetch('/api/resign', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        return;
                    }
                    gameLocked = true;
                    alert(data.message);
                });
        });

        // On page load: check if a game is already in progress on the
        // server (e.g. the user refreshed mid-game) and restore it,
        // instead of always showing the mode-select screen.
        fetch('/api/board')
            .then(response => response.json())
            .then(data => {
                if (data.game_started) {
                    document.getElementById('modeSelect').style.display = 'none';
                    document.getElementById('gameArea').style.display = 'flex';
                    gameLocked = data.is_game_over;
                    board.position(data.fen, false);
                    updateMoveList();
                }
            });
    </script>

</body>
</html>

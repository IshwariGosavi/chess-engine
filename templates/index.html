<!DOCTYPE html>
<html>
<head>
    <title>Chess Engine</title>

    <!-- chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            margin-top: 40px;
        }

        #board {
            width: 400px;
        }
    </style>
</head>
<body>

    <h1>Chess Engine</h1>

    <div style="display: flex; gap: 40px; align-items: flex-start;">
        <div>
            <div id="board"></div>
            <button id="newGameBtn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px;">New Game</button>
            <button id="undoBtn" style="margin-top: 20px; margin-left: 10px; padding: 10px 20px; font-size: 16px;">Undo</button>
        </div>
        <div>
            <h3>Moves</h3>
            <table id="moveList" style="border-collapse: collapse; min-width: 150px;"></table>
        </div>
    </div>

    <!-- jQuery (chessboard.js dependency) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- chessboard.js -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;

        function onDragStart(source, piece, position, orientation) {
            // Don't allow moving pieces if the game is already over
            // (we'll refine this further in a later day)
            return true;
        }

        function renderMoveList(moves) {
            var table = document.getElementById('moveList');
            table.innerHTML = '';  // clear existing rows

            for (var i = 0; i < moves.length; i += 2) {
                var moveNumber = (i / 2) + 1;
                var whiteMove = moves[i] || '';
                var blackMove = moves[i + 1] || '';

                var row = document.createElement('tr');
                row.innerHTML =
                    '<td style="padding: 4px 8px; color: #888;">' + moveNumber + '.</td>' +
                    '<td style="padding: 4px 8px; font-weight: bold;">' + whiteMove + '</td>' +
                    '<td style="padding: 4px 8px;">' + blackMove + '</td>';
                table.appendChild(row);
            }
        }

        function updateMoveList() {
            fetch('/api/moves')
                .then(response => response.json())
                .then(data => {
                    renderMoveList(data.moves);
                });
        }

        function onDrop(source, target, piece) {
            var moveUci = source + target;

            // Check if this is a pawn reaching the final rank (promotion)
            var isPawn = piece === 'wP' || piece === 'bP';
            var reachedLastRank = target[1] === '8' || target[1] === '1';

            if (isPawn && reachedLastRank) {
                moveUci += 'q';  // auto-promote to queen for now
            }

            // Try the move on the server
            fetch('/api/human-move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ move: moveUci })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    // Illegal move — force the board back to the server's
                    // last known correct position.
                    fetch('/api/board')
                        .then(response => response.json())
                        .then(boardData => {
                            board.position(boardData.fen, false);
                        });
                    return;
                }

                // Legal move — update to match server's new state
                board.position(data.fen, false);
                updateMoveList();

                if (data.is_game_over) {
                    alert("Game over!");
                    return;
                }

                // Ask the engine to make its move
                fetch('/api/engine-move')
                    .then(response => response.json())
                    .then(engineData => {
                        board.position(engineData.fen, false);
                        updateMoveList();
                        if (engineData.is_game_over) {
                            alert("Game over!");
                        }
                    });
            });
        }

        var config = {
            draggable: true,
            position: 'start',   // temporary placeholder, corrected below
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop
        };

        board = Chessboard('board', config);

        // On page load, sync the visual board with whatever the server
        // actually has right now — don't assume it's a fresh game.
        fetch('/api/board')
            .then(response => response.json())
            .then(data => {
                board.position(data.fen, false);
                updateMoveList();
            });

        document.getElementById('newGameBtn').addEventListener('click', function() {
            fetch('/api/reset', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    board.position(data.fen, false);
                    updateMoveList();
                });
        });

        document.getElementById('undoBtn').addEventListener('click', function() {
            fetch('/api/undo', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    board.position(data.fen, false);
                    updateMoveList();
                });
        });
    </script>

</body>
</html>
